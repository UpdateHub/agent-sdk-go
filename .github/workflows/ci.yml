name: CI

on:
  push:
    branches:
      - v2
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The version the module declares, and the newest release. They are the
        # same toolchain until Go moves on, and no version is named here, so the
        # floor is stated once, in go.mod.
        include:
          - name: declared
            versionFile: go.mod
          - name: latest
            version: stable
    name: Go ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.version }}
          go-version-file: ${{ matrix.versionFile }}

      - name: Build
        run: go build ./...

      - name: Check the formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt reports:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test -race ./...
